name: Run Crypto Opportunity Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: crypto-opportunity-engine
  cancel-in-progress: false

jobs:
  run-engine:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create output directory
        run: |
          mkdir -p output

      - name: Validate Python files
        run: |
          python -m compileall \
            main.py \
            config.py \
            data \
            engines \
            reports

      - name: Run Crypto Opportunity Engine
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Generate HTML report
        if: success()
        run: |
          python reports/report_html.py

      - name: Generate PDF report
        if: success()
        run: |
          python reports/report_pdf.py

      - name: Send report by email
        if: success()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from pathlib import Path
          from email.message import EmailMessage
          from datetime import datetime, timezone

          gmail_user = os.environ["GMAIL_USER"]
          gmail_password = os.environ["GMAIL_APP_PASSWORD"]

          recipient = "vilsonjosepereirapinto@gmail.com"

          output_dir = Path("output")

          pdf_file = output_dir / "crypto_opportunity_report.pdf"
          summary_file = output_dir / "engine_summary.txt"
          top_file = output_dir / "crypto_opportunities_top.csv"

          if not pdf_file.exists():
              raise FileNotFoundError(
                  f"PDF não encontrado: {pdf_file}"
              )

          if summary_file.exists():
              summary = summary_file.read_text(
                  encoding="utf-8"
              )
          else:
              summary = (
                  "Crypto Opportunity Engine executado "
                  "com sucesso."
              )

          generated_at = datetime.now(
              timezone.utc
          ).strftime("%d/%m/%Y %H:%M UTC")

          message = EmailMessage()

          message["From"] = gmail_user
          message["To"] = recipient
          message["Subject"] = (
              "Crypto Opportunity Engine — "
              "Relatório Diário"
          )

          body = f"""
CRYPTO OPPORTUNITY ENGINE

Execução concluída com sucesso.

Data da execução:
{generated_at}

RESUMO DO MOTOR
============================================================

{summary}

============================================================

O relatório completo está anexado em PDF.

Metodologia:
O motor procura projetos cripto de qualidade em que a melhora
econômica e fundamental esteja avançando mais rapidamente do
que a precificação do mercado.

O timing é analisado separadamente da qualidade da oportunidade.

Arquivo principal:
crypto_opportunity_report.pdf
"""

          message.set_content(body)

          with pdf_file.open("rb") as file:
              message.add_attachment(
                  file.read(),
                  maintype="application",
                  subtype="pdf",
                  filename=pdf_file.name,
              )

          if top_file.exists():
              with top_file.open("rb") as file:
                  message.add_attachment(
                      file.read(),
                      maintype="text",
                      subtype="csv",
                      filename=top_file.name,
                  )

          print(
              "[email] Conectando ao Gmail SMTP..."
          )

          with smtplib.SMTP_SSL(
              "smtp.gmail.com",
              465,
              timeout=30,
          ) as smtp:

              smtp.login(
                  gmail_user,
                  gmail_password,
              )

              smtp.send_message(
                  message
              )

          print(
              "[email] Relatório enviado com sucesso para "
              + recipient
          )
          PY

      - name: Show output files
        if: always()
        run: |
          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"

          if [ -d "output" ]; then
            find output \
              -maxdepth 1 \
              -type f \
              -printf "%f\n" \
              | sort
          else
            echo "Output directory not found."
          fi

      - name: Upload engine results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-opportunity-engine-results
          path: |
            output/
          if-no-files-found: warn
          retention-days: 30
