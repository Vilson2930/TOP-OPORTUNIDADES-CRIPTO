name: Run Crypto Opportunity Engine

on:
  workflow_dispatch:

  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: crypto-opportunity-engine
  cancel-in-progress: false

jobs:
  run-engine:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create output directory
        run: |
          mkdir -p output

      - name: Validate Python files
        run: |
          python -m compileall \
            main.py \
            config.py \
            data \
            engines \
            reports

      - name: Run Crypto Opportunity Engine
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python main.py

      - name: Generate HTML report
        if: success()
        run: |
          python reports/report_html.py

      - name: Generate PDF report
        if: success()
        run: |
          python reports/report_pdf.py

      - name: Show output files
        if: always()
        run: |
          echo "========================================"
          echo "OUTPUT FILES"
          echo "========================================"

          if [ -d "output" ]; then
            find output \
              -maxdepth 1 \
              -type f \
              -printf "%f\n" \
              | sort
          else
            echo "Output directory not found."
          fi

      - name: Upload engine results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-opportunity-engine-results
          path: |
            output/
          if-no-files-found: warn
          retention-days: 30
